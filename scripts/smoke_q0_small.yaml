# SPDX-License-Identifier: Apache-2.0
experiment:
  name: artifact_smoke_q0_small
  description: >
    Getting-started smoke test for the SIGMOD artifact: one query (q0, SELECT * csv->json) over the smallest
    ExternalData set (nexmark/bid_653M.csv, 667 MB, fetched by data/fetch_testdata.sh), fully optimised
    configuration (compiled SIMDCSV formatter, fnattr + inlining + constant-byte folding, W4), one repetition.
    PASS = pbench reports `Done: 1 completed, 0 failed` and a throughput line (MB/s and Mrows/s; rows/s uses the
    catalog's 18,106,394 input rows). Wall time ~1 min incl. JIT compilation. Not a paper number (W4, small file) -- it proves
    worker + nes-cli + pbench + data wiring on a fresh machine.
    RUN: cd $PBENCH_DIR && pkill -9 -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           <artifact>/scripts/smoke_q0_small.yaml --build-dir $NES_BUILD_DIR --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: small
  topology: single-node
  warm_read: true
  completion_timeout_s: 600
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, f64: EiselFloatF64, f32: EiselFloatF32, bool: TracedBOOL }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

variants:
  - name: q0_bid_star_small
    description: "q0 SELECT * csv->json on bid_653M, optimised W4, 1 rep"
    query: nexmark/bid_star
    axes: { x: *noop_x }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: grouped_bar }
