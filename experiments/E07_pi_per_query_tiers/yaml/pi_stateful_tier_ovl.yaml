experiment:
  name: pi_stateful_tier_ovl
  description: >
    OVERLOAD RETAKE (staged 2026-10-05 real; Pi clock ~6 d behind). Identical to pi_stateful_tier except a 2-entry
    series: ctrl (verbatim, lazy overloads OFF = the engine default the tier silently ran with) vs ovl (pbench
    overload: true -> INPUT_FORMATTER.LAZY_INT/UINT/FLOAT_OVERLOADS). Audit 2026-10-05: NO per-query tier or ladder
    on either box ever set the knob; the Sept Fig1/Fig2 teasers did -> Fig1 Q2 (overload ON) vs the per-query
    table (OFF) were inconsistent. Expected to move: q2_og (5x INT32 ==); minor: q_ex (INT32 == on survivors),
    cm_q2 (INT16 == 3). VARSIZED equality is always overloaded (q_route/ysb unaffected); q14/q2_mod cannot be.
    Same-session ctrl makes the A/B binary-drift-proof. overload sits in a series override on purpose (the
    stale validation rule on this checkout rejects it in defaults).
    PI PROBE F - the FROZEN PAPER_WORKLOAD Set B STATEFUL TIER (3 queries spanning the state-cost
    axis) on a 4-core Raspberry Pi 5, csv -> json, NES only. Companion to pi_stateless_tier.
    ysb_1k_varsized = tumbling count per campaign, the "stateless-like" input-bound pole;
    q8_join = person JOIN auction tumble 10s, the state-dominated pole; cm_q2 = sliding 60s/1s
    SUM(cpu) by jobId, the middle (each row lands in 60 windows).
    NO FLINK / SPARK ARM: neither is installed on this box (no JVM, no pyspark/pyflink). This is
    not the three-way head-to-head - do not read it as one.
    STACK (frozen, verbatim): MmapFile + NES_MMAP_POPULATE=1, warm_read page cache, SIMDCSV in
    with the fast parser set -> JSON output + ZMIJ float codec into Monitoring, fnattr, 128 KiB
    operator buffers, COMPILER, pin/ccx OFF. TracedBOOL is REQUIRED (cm has a BOOLEAN column;
    DefaultBOOL SIGABRTs release workers). q8 gets the buffer-COUNT-bound stateful pool
    (4 KiB x 2,000,000 = 8 GB) because window state is consumed by buffer COUNT, not bytes.
    generator.repeat = 1 ALWAYS: replaying a file into event-time windows corrupts the NES heap.
    PI DEVIATIONS - two, both forced by the hardware, both stated in the results:
      1. number_of_worker_threads 23 -> 3 (+ io1). The frozen W23+io1 = the reference box's 24
         physical cores; this box has 4, so W3+io1 = 4 is the same topology. W3 is also the
         measured stateless optimum (pi_stateless_wsweep). CAVEAT: it was measured on STATELESS
         shapes. Stateful work is dominated by window-trigger lock contention (per CLAUDE.md,
         74% of cycles in SharedMutex wait/wake inside triggerSlices), which can prefer a LOWER
         W. The stateless optimum is an assumption here, not a measurement - see the W-sweep
         caveat in the results write-up.
      2. ysb_1k_varsized runs at data_size large, NOT the frozen xlarge. xlarge needs
         ysb1k_varsized_ext4_15G.csv (14.85 GB) which is not on this box, and at 14.85 GB could
         not be page-cache resident in 16 GB anyway - that arm would become NVMe-bound (~900
         MB/s, PCIe Gen3 x1) and stop being comparable with the other two. large (3.7 GB, 20M
         rows) fits cache AND has a recorded validation entry (68000 / 278998939) that xlarge
         lacks, so correctness is checkable. Fewer windows are triggered than the frozen arm.
    PRE-FLIGHT DONE: person_840MB.csv and auction_707MB.csv were re-converted to LF on
    2026-08-21 (the build-dir regeneration had restored the CRLF ExternalData symlinks);
    correctness verified by pi_stateful_checksum_gate before this timing run.
    REP HISTORY: this experiment was first run at 3 reps; this configuration adds 7 more so the
    NES arm is POOLED to n=10, matching the Flink and Spark arms (which ran 10 reps). Both
    run_groups live in the raw runs table. IMPORTANT: pbench aggregated view is scoped to the
    LATEST run_group only, so it will show n=7, not the pooled n=10 - compute medians from the
    runs table directly. Build, commit, config and CPU governor (performance) are identical
    across both run_groups; the 3-rep and 7-rep medians were compared for drift before pooling.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 7
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 3
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: MmapFile
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: "1"

_w_x: &w_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [3]

_y: &mbps_y { metric: throughput_mbps, label: "Throughput (MB/s, csv input bytes)" }

# Nexmark joins are buffer-COUNT-bound: window state is consumed by buffer COUNT, not bytes, so
# a passthrough-tuned pool (few big buffers) fails with "Global buffer pool could not allocate
# buffer before timeout". Frozen value = 4 KiB x 2,000,000 = 8 GB. NOTE for this box: that is
# half of the Pi's 16 GB. CLAUDE.md records the MEASURED count floor for q8 as <=64K buffers
# (256 MB), so there is a lot of headroom to step down if 8 GB causes pressure here.
_stateful_pool: &stateful_pool
  worker.default_query_execution.operator_buffer_size: 4096
  worker.number_of_buffers_in_global_buffer_manager: 2000000

_ovl_s: &ovl_s
  label: "lazy overloads"
  explicit:
    - name: ctrl
      baseline: true
      overrides: {}
    - name: ovl
      overrides: { overload: true }

variants:
  - name: ysb_1k_varsized
    description: "YSB varsized 1k, tumble 30s count per campaign (input-bound pole)"
    query: yahoo/ysb_1k_varsized
    axes: { x: *w_x, series: *ovl_s }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q8_join
    description: "Nexmark Q8: person JOIN auction, tumble 10s (state-dominated pole)"
    query: nexmark/q8_join
    overrides: *stateful_pool
    axes: { x: *w_x, series: *ovl_s }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: cm_q2
    description: "ClusterMonitoring Q2: sliding 60s/1s SUM(cpu) by jobId, eventType=3 (middle)"
    query: cluster_monitoring/q2_original
    axes: { x: *w_x, series: *ovl_s }
    y: *mbps_y
    visualization: { type: bar_chart }
