  - name: q2_og
    description: "q2-og: 5-way OR point selection (repeated-parse/GVN territory)"
    query: nexmark/matrix/bidstr_q2og
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q2_mod
    description: "q2-mod: auctionId % 123 = 0 filter (~0.82% survivors)"
    query: nexmark/matrix/bidstr_q2mod
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q10
    description: "q10: ms-epoch -> ISO-8601 datetime export (UTC)"
    query: nexmark/matrix/bidstr_q10
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q14
    description: "q14: computed-float range filter"
    query: nexmark/matrix/bidstr_q14
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q22
    description: "q22: unconditional CONCAT alert (string-output regime)"
    query: nexmark/matrix/bidstr_q22
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q_ex
    description: "Q_ex: HOSP working example (mixed-predicate filter -> nested CONCAT, ~220 rows)"
    query: nexmark/matrix/bidstr_qex
    axes: { x: *w_x }
    y: *mbps_y
    visualization: { type: bar_chart }
