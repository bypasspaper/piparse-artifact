# SPDX-License-Identifier: Apache-2.0
# Fig1 profiling window: NAIVE arm (SequentialUncompiledOldCSV scalar + JSONUncompiled +
# NES_INPUT/OUTPUT_CODEC=original), InMemory-prefill (nulls read), W1 sequential. repeat=10
# -> ~100-130s warm steady window so nes-profile.sh can attach on :9099 and sample. Not a
# throughput datapoint; the value is the per-symbol self-time split (deser/proc/serialize).
experiment:
  name: fig1_naive_prof_q0
  description: 'Fig1 naive per-stage profiling window: q0'
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  cold_read: false
  completion_timeout_s: 400
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter:
      type: SequentialUncompiledOldCSV
      threading_mode: sequential
    output_formatter:
      type: JSONUncompiled
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 10
    mode: burst
    rate: 1000000
  worker_env:
    NES_INMEM_PREFILL: '1'
    NES_INMEM_REPEAT: '10'
    NES_INMEM_BUFSIZE: '131072'
    NES_INPUT_CODEC: original
    NES_OUTPUT_CODEC: original
variants:
  - name: q0
    description: 'naive InMemory profiling window: q0'
    query: nexmark/bid_star
    axes:
      x:
        label: config
        explicit:
          - name: naive
            baseline: true
            overrides: {}
    y:
      metric: throughput_mbps
      label: MB/s
    visualization:
      type: bar_chart
