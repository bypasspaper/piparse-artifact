# SPDX-License-Identifier: Apache-2.0
# Fig2 STAGE-CPU profiling window (2026-09-25): LAZY arm (compiled SequentialCSV, lazy passthrough, fnattr, fast codecs), repeat 400 -> ~20-30 s window. Query multicol/pass_n1 (plain SELECT of all 1 FLOAT64
# columns, csv->json, 200 MB nf1.csv, InMemory prefill W1). NOT a throughput datapoint: perf flat 15 s @ 4 kHz,
# classify by stage (deser = index+parse / process = copy+operators+engine / serialize = format+JSON framing).
experiment:
  name: fig2_prof_sweep_lazy_n1
  description: 'Fig2 stage-CPU profiling window: sweep_lazy_n1'
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 900
  overload: false
  worker:
    query_engine: {number_of_worker_threads: 1, number_of_io_threads: 1, invoke_mode_configuration: fnattr, pin_threads: false, admission_queue_size: 1024}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: sequential}
    input_parser: {uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32}
    output_formatter: {type: JSON}
    output_parser: {f64: ZMIJF64, f32: ZMIJF32}
  generator: {repeat: 400, mode: burst, rate: 1000000}
  worker_env: {NES_INMEM_PREFILL: '1', NES_INMEM_REPEAT: '400', NES_INMEM_BUFSIZE: '131072'}
variants:
  - name: sweep_lazy_n1
    description: 'profiling window sweep_lazy_n1'
    query: multicol/pass_n1
    axes:
      x: {label: config, explicit: [{name: lazy, baseline: true, overrides: {}}]}
    y: {metric: throughput_mbps, label: MB/s}
    visualization: {type: bar_chart}
